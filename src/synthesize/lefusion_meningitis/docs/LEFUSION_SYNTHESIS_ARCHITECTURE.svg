<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">LeFusion-H 脑膜炎病灶合成架构</title>
  <desc id="desc">展示数据准备与 DDPM 训练、vendored LeFusion Unet3D 内部架构，以及 FastSurfer 约束的实际合成推理管线。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4C78A8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3F8F48"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D97816"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C8484A"/></marker>
    <style>
      .title{font:700 24px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.subtitle{font:14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.section{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.label{font:14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.small{font:12px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.bold{font-weight:700}.box{fill:#fff;stroke-width:1.5}.blue{stroke:#4C78A8}.green{stroke:#3F8F48}.orange{stroke:#D97816}.purple{stroke:#7B57A5}.red{stroke:#C8484A}.gray{stroke:#777;stroke-dasharray:6 5}.edge-blue{fill:none;stroke:#4C78A8;stroke-width:2;marker-end:url(#arrow-blue)}.edge-green{fill:none;stroke:#3F8F48;stroke-width:2;marker-end:url(#arrow-green)}.edge-orange{fill:none;stroke:#D97816;stroke-width:2;marker-end:url(#arrow-orange)}.edge-red{fill:none;stroke:#C8484A;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect width="1800" height="1160" fill="#ffffff"/>
  <text x="900" y="32" text-anchor="middle" class="title">LeFusion-H 脑膜炎病灶合成架构</text>
  <text x="900" y="55" text-anchor="middle" class="subtitle">patch 32³ · C=1 · histogram=16 · base dim=32 · [1,2,4,8] · T=300 · 10,033,825 parameters</text>

  <rect x="18" y="75" width="1764" height="240" rx="14" fill="#EAF2FF" stroke="#4C78A8" stroke-width="2"/>
  <text x="38" y="104" class="section">A. 数据准备与 DDPM 训练</text>

  <g transform="translate(38 130)"><rect width="150" height="65" rx="9" class="box blue"/><text x="75" y="25" text-anchor="middle" class="label bold">nnUNet 真实数据</text><text x="75" y="47" text-anchor="middle" class="small">MRI + GT label</text></g>
  <g transform="translate(220 130)"><rect width="165" height="65" rx="9" class="box blue"/><text x="82" y="23" text-anchor="middle" class="label">RAS + robust normalize</text><text x="82" y="45" text-anchor="middle" class="small">z-score → clip → [-1,1]</text></g>
  <g transform="translate(420 130)"><rect width="165" height="65" rx="9" class="box blue"/><text x="82" y="23" text-anchor="middle" class="label">连通域与中心裁剪</text><text x="82" y="45" text-anchor="middle" class="small">image/mask patch 32³</text></g>
  <g transform="translate(620 130)"><rect width="175" height="65" rx="9" class="box blue"/><text x="87" y="23" text-anchor="middle" class="label">MONAI 联合增强</text><text x="87" y="45" text-anchor="middle" class="small">x₀ + mask + hist[16]</text></g>
  <g transform="translate(840 130)"><rect width="190" height="65" rx="9" fill="#FFF3E3" class="orange" stroke-width="1.5"/><text x="95" y="22" text-anchor="middle" class="label bold">q_sample</text><text x="95" y="44" text-anchor="middle" class="small">random t,ε → noisy xₜ</text></g>
  <g transform="translate(1070 120)"><rect width="215" height="85" rx="9" fill="#DDF1E1" class="green" stroke-width="2.5"/><text x="107" y="28" text-anchor="middle" class="label bold">Vendored LeFusion Unet3D</text><text x="107" y="51" text-anchor="middle" class="small">(xₜ, t, histogram) → εθ</text><text x="107" y="70" text-anchor="middle" class="small">mask 不进入 U-Net</text></g>
  <g transform="translate(1330 120)"><rect width="190" height="85" rx="9" fill="#FDECEC" class="red" stroke-width="1.5"/><text x="95" y="27" text-anchor="middle" class="label bold">foreground L1</text><text x="95" y="50" text-anchor="middle" class="small">mask 加权</text><text x="95" y="69" text-anchor="middle" class="small">每样本前景数归一化</text></g>
  <g transform="translate(1560 120)"><rect width="190" height="85" rx="9" fill="#F5F0FF" class="purple" stroke-width="1.5"/><text x="95" y="25" text-anchor="middle" class="label">AdamW / AMP / EMA</text><text x="95" y="48" text-anchor="middle" class="small">validation + early stop</text><text x="95" y="69" text-anchor="middle" class="small">best.pt (ema_model)</text></g>
  <path d="M188 162 H220" class="edge-blue"/><path d="M385 162 H420" class="edge-blue"/><path d="M585 162 H620" class="edge-blue"/><path d="M795 162 H840" class="edge-orange"/><path d="M1030 162 H1070" class="edge-green"/><path d="M1285 162 H1330" class="edge-green"/><path d="M1520 162 H1560" class="edge-blue"/>
  <text x="900" y="250" text-anchor="middle" class="small">linear β: 1e-4 → 2e-2；T=300 时 alpha_bar₂₉₉=0.0481，前向末态并非近似纯噪声</text>
  <rect x="520" y="268" width="760" height="30" rx="6" fill="#FFF3E3" stroke="#D97816" stroke-dasharray="6 4"/><text x="900" y="289" text-anchor="middle" class="small">LeFusion 仓库在当前路径中只提供 Unet3D 及基础块；官方 GaussianDiffusion_Nolatent / Trainer / inference 未被调用</text>

  <rect x="18" y="335" width="1764" height="275" rx="14" fill="#ECF8EE" stroke="#3F8F48" stroke-width="2"/>
  <text x="38" y="364" class="section">B. Unet3D 内部：2D 平面卷积 + 切片内空间注意力 + 跨切片 temporal attention</text>
  <g transform="translate(42 402)"><rect width="120" height="58" rx="9" class="box green"/><text x="60" y="23" text-anchor="middle" class="label">xₜ</text><text x="60" y="43" text-anchor="middle" class="small">[B,1,32,32,32]</text></g>
  <g transform="translate(195 402)"><rect width="145" height="58" rx="9" class="box green"/><text x="72" y="23" text-anchor="middle" class="label">Stem Conv (1,7,7)</text><text x="72" y="43" text-anchor="middle" class="small">C 1 → 32</text></g>
  <g transform="translate(375 395)"><rect width="175" height="72" rx="9" class="box green"/><text x="87" y="24" text-anchor="middle" class="label">Init temporal MHA</text><text x="87" y="45" text-anchor="middle" class="small">rotary + relative bias</text><text x="87" y="62" text-anchor="middle" class="small">F=32 不下采样</text></g>
  <g transform="translate(590 382)"><rect width="220" height="100" rx="9" fill="#DDF1E1" class="green" stroke-width="1.5"/><text x="110" y="22" text-anchor="middle" class="label bold">Encoder</text><text x="110" y="44" text-anchor="middle" class="small">C32 @ F32×32×32</text><text x="110" y="61" text-anchor="middle" class="small">C64 @ F32×16×16</text><text x="110" y="78" text-anchor="middle" class="small">C128 @ F32×8×8 → C256 @ F32×4×4</text></g>
  <g transform="translate(850 382)"><rect width="210" height="100" rx="9" fill="#CDEACF" class="green" stroke-width="2.5"/><text x="105" y="22" text-anchor="middle" class="label bold">Bottleneck C256</text><text x="105" y="44" text-anchor="middle" class="small">FiLM ResNet</text><text x="105" y="61" text-anchor="middle" class="small">full spatial MHA</text><text x="105" y="78" text-anchor="middle" class="small">temporal MHA + FiLM ResNet</text></g>
  <g transform="translate(1100 382)"><rect width="230" height="100" rx="9" fill="#DDF1E1" class="green" stroke-width="1.5"/><text x="115" y="22" text-anchor="middle" class="label bold">Decoder + skip</text><text x="115" y="44" text-anchor="middle" class="small">C128 @ F32×4×4 → C64 @ F32×8×8</text><text x="115" y="61" text-anchor="middle" class="small">C32 @ F32×16×16</text><text x="115" y="78" text-anchor="middle" class="small">C32 @ F32×32×32</text></g>
  <g transform="translate(1370 395)"><rect width="180" height="72" rx="9" class="box green"/><text x="90" y="22" text-anchor="middle" class="label">Final stem skip</text><text x="90" y="43" text-anchor="middle" class="small">ResNet 64→32</text><text x="90" y="60" text-anchor="middle" class="small">1×1×1 Conv 32→1</text></g>
  <g transform="translate(1590 402)"><rect width="150" height="58" rx="9" class="box green"/><text x="75" y="23" text-anchor="middle" class="label">εθ</text><text x="75" y="43" text-anchor="middle" class="small">[B,1,32,32,32]</text></g>
  <path d="M162 431 H195" class="edge-green"/><path d="M340 431 H375" class="edge-green"/><path d="M550 431 H590" class="edge-green"/><path d="M810 431 H850" class="edge-green"/><path d="M1060 431 H1100" class="edge-green"/><path d="M1330 431 H1370" class="edge-green"/><path d="M1550 431 H1590" class="edge-green"/>
  <g transform="translate(210 510)"><rect width="260" height="65" rx="9" fill="#FFF3E3" class="orange" stroke-width="1.5"/><text x="130" y="22" text-anchor="middle" class="label">t → Sinusoidal(32) → MLP(128)</text><text x="130" y="45" text-anchor="middle" class="small">concat histogram[16] = condition[144]</text></g>
  <g transform="translate(560 510)"><rect width="480" height="65" rx="9" fill="#fff" class="green" stroke-dasharray="6 4"/><text x="240" y="22" text-anchor="middle" class="label">每个 encoder/decoder stage</text><text x="240" y="45" text-anchor="middle" class="small">2× FiLM ResNet + spatial linear attention + temporal MHA + H/W-only sampling</text></g>
  <g transform="translate(1130 510)"><rect width="430" height="65" rx="9" fill="#F2F2F2" class="gray"/><text x="215" y="22" text-anchor="middle" class="label">mask 不参与 condition</text><text x="215" y="45" text-anchor="middle" class="small">histogram 直接拼接，无独立 condition encoder</text></g>
  <path d="M470 542 H560" class="edge-orange"/><path d="M340 510 V480 H700" class="edge-orange"/>

  <rect x="18" y="630" width="1764" height="510" rx="14" fill="#FFF5E9" stroke="#D97816" stroke-width="2"/>
  <text x="38" y="660" class="section">C. 实际合成推理：FastSurfer 中心约束 + 供体 mask + 背景注入 DDPM + 后处理</text>
  <g transform="translate(40 700)"><rect width="155" height="58" rx="9" class="box orange"/><text x="77" y="23" text-anchor="middle" class="label bold">目标 MRI + label</text><text x="77" y="43" text-anchor="middle" class="small">current cumulative image</text></g>
  <g transform="translate(40 790)"><rect width="155" height="58" rx="9" class="box orange"/><text x="77" y="23" text-anchor="middle" class="label">FastSurfer + LUT</text><text x="77" y="43" text-anchor="middle" class="small">ctx-lh / ctx-rh</text></g>
  <g transform="translate(40 880)"><rect width="155" height="58" rx="9" class="box orange"/><text x="77" y="23" text-anchor="middle" class="label">供体 lesion mask</text><text x="77" y="43" text-anchor="middle" class="small">train patch library</text></g>
  <g transform="translate(40 970)"><rect width="155" height="58" rx="9" class="box orange"/><text x="77" y="23" text-anchor="middle" class="label">histogram library</text><text x="77" y="43" text-anchor="middle" class="small">train_histograms.npy</text></g>
  <g transform="translate(245 700)"><rect width="190" height="58" rx="9" class="box orange"/><text x="95" y="23" text-anchor="middle" class="label">robust_normalize</text><text x="95" y="43" text-anchor="middle" class="small">当前影像 → [-1,1]</text></g>
  <g transform="translate(245 780)"><rect width="210" height="75" rx="9" class="box orange"/><text x="105" y="23" text-anchor="middle" class="label">cortical candidates</text><text x="105" y="44" text-anchor="middle" class="small">中心在皮层</text><text x="105" y="62" text-anchor="middle" class="small">最大 ROI 不越界</text></g>
  <g transform="translate(245 870)"><rect width="210" height="75" rx="9" class="box orange"/><text x="105" y="23" text-anchor="middle" class="label">transform donor mask</text><text x="105" y="44" text-anchor="middle" class="small">rotate + scale</text><text x="105" y="62" text-anchor="middle" class="small">geometry rejection</text></g>
  <g transform="translate(245 970)"><rect width="190" height="58" rx="9" class="box orange"/><text x="95" y="23" text-anchor="middle" class="label">sample + jitter</text><text x="95" y="43" text-anchor="middle" class="small">clip + sum normalize</text></g>
  <g transform="translate(500 790)"><rect width="230" height="90" rx="9" fill="#FFE6C7" class="orange" stroke-width="2.5"/><text x="115" y="25" text-anchor="middle" class="label bold">choose cortical ROI</text><text x="115" y="48" text-anchor="middle" class="small">合并 center + donor mask</text><text x="115" y="68" text-anchor="middle" class="small">避开已有/已合成标签</text></g>
  <g transform="translate(795 770)"><rect width="220" height="110" rx="9" fill="#DDF1E1" class="green" stroke-width="2.5"/><text x="110" y="24" text-anchor="middle" class="label bold">sample_patch</text><text x="110" y="47" text-anchor="middle" class="small">background ROI + mask</text><text x="110" y="66" text-anchor="middle" class="small">histogram + best.pt EMA</text><text x="110" y="87" text-anchor="middle" class="small">per-lesion torch.Generator</text></g>
  <g transform="translate(1060 725)"><rect width="270" height="160" rx="9" fill="#CDEACF" class="green" stroke-width="2"/><text x="135" y="25" text-anchor="middle" class="label bold">t = 299 ... 0</text><text x="135" y="51" text-anchor="middle" class="small">mask 外：q_sample(background,t)</text><text x="135" y="72" text-anchor="middle" class="small">mask 内：保留当前 sample</text><text x="135" y="95" text-anchor="middle" class="small">Unet3D(xₜ,t,hist) → εθ</text><text x="135" y="116" text-anchor="middle" class="small">posterior mean/variance step</text><text x="135" y="140" text-anchor="middle" class="small">t=0 后 mask 外恢复精确背景</text></g>
  <g transform="translate(1380 700)"><rect width="190" height="85" rx="9" fill="#FFF3E3" class="orange" stroke-width="1.5"/><text x="95" y="24" text-anchor="middle" class="label">brighten interior</text><text x="95" y="47" text-anchor="middle" class="small">外环带 90th percentile</text><text x="95" y="67" text-anchor="middle" class="small">距离变换渐进增亮</text></g>
  <g transform="translate(1380 815)"><rect width="190" height="70" rx="9" fill="#FFF3E3" class="orange" stroke-width="1.5"/><text x="95" y="26" text-anchor="middle" class="label">hard composite</text><text x="95" y="49" text-anchor="middle" class="small">仅替换 mask 内体素</text></g>
  <g transform="translate(1610 780)"><polygon points="75,0 150,55 75,110 0,55" fill="#FDECEC" stroke="#C8484A" stroke-width="1.5"/><text x="75" y="48" text-anchor="middle" class="label bold">QC</text><text x="75" y="69" text-anchor="middle" class="small">finite?</text></g>
  <g transform="translate(1380 950)"><rect width="190" height="80" rx="9" class="box blue"/><text x="95" y="24" text-anchor="middle" class="label">denormalize + restore</text><text x="95" y="47" text-anchor="middle" class="small">update image / label</text><text x="95" y="65" text-anchor="middle" class="small">恢复原坐标系</text></g>
  <g transform="translate(1600 950)"><rect width="165" height="105" rx="9" fill="#EAF2FF" class="blue" stroke-width="2.5"/><text x="82" y="24" text-anchor="middle" class="label bold">输出</text><text x="82" y="47" text-anchor="middle" class="small">synthetic NIfTI</text><text x="82" y="65" text-anchor="middle" class="small">label + mask</text><text x="82" y="83" text-anchor="middle" class="small">metadata + QC</text></g>
  <g transform="translate(550 970)"><rect width="310" height="58" rx="9" fill="#F2F2F2" class="gray"/><text x="155" y="22" text-anchor="middle" class="label">position_prior.json</text><text x="155" y="43" text-anchor="middle" class="small">被读取，但当前未参与后续计算</text></g>
  <path d="M195 729 H245" class="edge-orange"/><path d="M195 819 H245" class="edge-orange"/><path d="M195 909 H245" class="edge-orange"/><path d="M195 999 H245" class="edge-orange"/>
  <path d="M455 817 H500" class="edge-orange"/><path d="M455 907 H475 V850 H500" class="edge-orange"/>
  <path d="M435 729 H760 V800 H795" class="edge-green"/><path d="M730 835 H795" class="edge-green"/><path d="M435 999 H760 V850 H795" class="edge-green"/>
  <path d="M1015 825 H1060" class="edge-green"/><path d="M1330 780 H1380" class="edge-green"/><path d="M1475 785 V815" class="edge-orange"/><path d="M1570 850 H1610" class="edge-red"/><path d="M1685 890 V930 H1475 V950" class="edge-blue"/><path d="M1570 990 H1600" class="edge-blue"/>
  <path d="M1610 835 H1578 V1085 H110 V938" class="edge-red"/>
  <text x="1582" y="1072" class="small" fill="#C8484A">fail: retry donor/placement/generation</text>
  <text x="1700" y="920" class="small" fill="#4C78A8">pass</text>
  <rect x="40" y="1085" width="1230" height="35" rx="6" fill="#FFF3E3" stroke="#D97816" stroke-dasharray="6 4"/><text x="655" y="1108" text-anchor="middle" class="small">FastSurfer 只约束病灶中心在皮层，不要求整个 mask 在皮层内；当前 QC 只检查 non-finite，配置的边界/强度阈值未参与判定</text>
</svg>
